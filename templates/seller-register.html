{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="auth-container" style="min-height: calc(100vh - 300px); display: flex; align-items: center; justify-content: center; padding: 3rem 5%;">
    <div class="glass-card" style="max-width: 650px; width: 100%; padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 class="text-gold" style="font-size: 2rem; margin-bottom: 0.5rem;">ثبت‌نام فروشنده</h1>
            <p style="color: var(--gray-light); font-size: 0.9rem;">پس از تایید حساب، می‌توانید وارد شوید.</p>
        </div>

        <div id="message-container"></div>

        <form id="seller-register-form">
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--gray-light);">شماره تلفن</label>
                <input type="tel" id="phone_number" name="phone_number" pattern="09[0-9]{9}" placeholder="09123456789" required style="width: 100%; padding: 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: var(--white); font-size: 1rem;">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--gray-light);">نام</label>
                    <input type="text" id="first_name" name="first_name" required style="width: 100%; padding: 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: var(--white); font-size: 1rem;">
                </div>

                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--gray-light);">نام خانوادگی</label>
                    <input type="text" id="last_name" name="last_name" required style="width: 100%; padding: 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: var(--white); font-size: 1rem;">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--gray-light);">نام فروشگاه</label>
                <input type="text" id="seller_shop_name" name="seller_shop_name" required style="width: 100%; padding: 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: var(--white); font-size: 1rem;">
            </div>

            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--gray-light);">آدرس فروشگاه</label>
                <textarea id="seller_shop_address" name="seller_shop_address" required style="width: 100%; padding: 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: var(--white); font-size: 1rem; min-height: 120px;"></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--gray-light);">شهر</label>
                    <input type="text" id="city" name="city" style="width: 100%; padding: 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: var(--white); font-size: 1rem;">
                </div>

                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--gray-light);">استان</label>
                    <input type="text" id="province" name="province" style="width: 100%; padding: 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: var(--white); font-size: 1rem;">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--gray-light);">رمز عبور</label>
                    <input type="password" id="password" name="password" minlength="8" required style="width: 100%; padding: 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: var(--white); font-size: 1rem;">
                    <p style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--gray-light);">رمز عبور باید حداقل ۸ کاراکتر داشته باشد.</p>
                </div>

                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--gray-light);">تکرار رمز عبور</label>
                    <input type="password" id="password_confirm" name="password_confirm" minlength="8" required style="width: 100%; padding: 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: var(--white); font-size: 1rem;">
                    <p style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--gray-light);">رمز عبور را دوباره وارد کنید.</p>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem;">
                ثبت‌نام فروشنده
            </button>
        </form>

        <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.1); color: var(--gray-light);">
            قبلاً ثبت‌نام کرده‌اید؟
            <a href="{% url 'seller_login' %}" style="color: var(--primary-gold); text-decoration: none; font-weight: 500;">ورود فروشنده</a>
        </div>
    </div>
</div>

<style>
    .form-group input:focus, .form-group textarea:focus {
        outline: none;
        border-color: var(--primary-gold);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 15px var(--primary-gold-glow);
    }

    .error-message {
        background: rgba(244, 67, 54, 0.2);
        border: 1px solid #f44336;
        border-radius: 12px;
        padding: 0.75rem;
        margin-bottom: 1rem;
        color: #ff6b6b;
        font-size: 0.85rem;
        text-align: center;
    }

    .success-message {
        background: rgba(76, 175, 80, 0.2);
        border: 1px solid #4caf50;
        border-radius: 12px;
        padding: 0.75rem;
        margin-bottom: 1rem;
        color: #81c784;
        font-size: 0.85rem;
        text-align: center;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('seller-register-form');
        const messageContainer = document.getElementById('message-container');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            messageContainer.innerHTML = '';

            const phone_number = document.getElementById('phone_number').value.trim();
            const first_name = document.getElementById('first_name').value.trim();
            const last_name = document.getElementById('last_name').value.trim();
            const seller_shop_name = document.getElementById('seller_shop_name').value.trim();
            const seller_shop_address = document.getElementById('seller_shop_address').value.trim();
            const city = document.getElementById('city').value.trim();
            const province = document.getElementById('province').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;

            if (!/^09\d{9}$/.test(phone_number)) {
                showMessage('شماره تلفن باید ۱۱ رقمی و با ۰۹ شروع شود.', 'error');
                return;
            }

            if (!first_name) {
                showMessage('نام الزامی است.', 'error');
                return;
            }

            if (!last_name) {
                showMessage('نام خانوادگی الزامی است.', 'error');
                return;
            }

            if (!seller_shop_name) {
                showMessage('نام فروشگاه الزامی است.', 'error');
                return;
            }

            if (!seller_shop_address) {
                showMessage('آدرس فروشگاه الزامی است.', 'error');
                return;
            }

            if (password.length < 8) {
                showMessage('رمز عبور باید حداقل ۸ کاراکتر داشته باشد.', 'error');
                return;
            }

            if (password !== passwordConfirm) {
                showMessage('رمز عبور و تکرار آن با هم مطابقت ندارند.', 'error');
                return;
            }

            const payload = {
                phone_number,
                first_name,
                last_name,
                password,
                seller_shop_name,
                seller_shop_address,
                city: city || null,
                province: province || null
            };

            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'در حال ثبت‌نام...';
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/accounts/seller/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) {
                    const detail = data.detail || Object.values(data).flat().join(' ');
                    showMessage(detail || 'ثبت‌نام انجام نشد. دوباره تلاش کنید.', 'error');
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                    return;
                }

                showMessage('ثبت‌نام با موفقیت انجام شد. پس از تایید حساب، می‌توانید وارد شوید.', 'success');
                window.location.href = '/seller/login/';
            } catch (err) {
                showMessage('خطا در ارتباط با سرور. دوباره تلاش کنید.', 'error');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        function showMessage(message, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = type === 'error' ? 'error-message' : 'success-message';
            msgDiv.textContent = message;
            messageContainer.appendChild(msgDiv);
        }
    });
</script>
{% endblock %}
