{% extends "base.html" %}
{% block content %}
    <section class="container" style="padding-top: 3rem;">
        <div class="glass-card" style="text-align: center;">
            <h1 class="text-gold" style="margin-bottom: 1rem;">فروشگاه امتیاز</h1>
            <p style="color: var(--gray-light);">امتیازهایت را به محصولات و جوایز جذاب تبدیل کن.</p>
        </div>
    </section>

    <div class="points-card">
        <span>امتیاز شما</span>
        <span class="points-amount"><span class="user-points">1250</span> امتیاز</span>
    </div>

    <div class="filter-tabs">
        <button class="filter-tab active" data-filter="همه">همه</button>
        <button class="filter-tab" data-filter="کتاب">کتاب</button>
        <button class="filter-tab" data-filter="دوره">دوره آموزشی</button>
        <button class="filter-tab" data-filter="هدیه">هدایا</button>
    </div>

    <div class="shop-grid">
        <!-- Filled by main.js -->
    </div>
{% endblock %}
