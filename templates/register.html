{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="auth-container">
    <div class="glass-card">
        <div class="card-header">
            <h1 class="text-gold">ثبت‌نام کاربر</h1>
            <p class="subtitle">برای شروع، اطلاعات خود را با دقت وارد کنید</p>
        </div>

        <div id="message-container"></div>

        <form id="register-form">
            <!-- شماره تلفن -->
            <div class="form-group full-width">
                <label for="phone_number">شماره تلفن (نام کاربری)</label>
                <input type="tel" id="phone_number" name="phone_number" class="form-control" pattern="09[0-9]{9}" placeholder="مثال: 09123456789" dir="ltr" required>
            </div>

            <!-- نام و نام خانوادگی -->
            <div class="grid-2">
                <div class="form-group">
                    <label for="first_name">نام</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" placeholder="نام خود را وارد کنید" required>
                </div>
                <div class="form-group">
                    <label for="last_name">نام خانوادگی</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" placeholder="نام خانوادگی خود را وارد کنید" required>
                </div>
            </div>

            <!-- کد ملی و تاریخ تولد -->
            <div class="grid-2">
                <div class="form-group">
                    <label for="national_code">کد ملی</label>
                    <input type="text" id="national_code" name="national_code" class="form-control" pattern="[0-9]{10}" placeholder="کد ملی ۱۰ رقمی (اختیاری)" dir="ltr">
                </div>
                <div class="form-group">
                    <label for="birth_date">تاریخ تولد</label>
                    <input type="date" id="birth_date" name="birth_date" class="form-control">
                </div>
            </div>

            <!-- جنسیت و استان -->
            <div class="grid-2">
                <div class="form-group">
                    <label for="gender">جنسیت</label>
                    <select id="gender" name="gender" class="form-control">
                        <option value="">انتخاب کنید...</option>
                        <option value="male">مرد</option>
                        <option value="female">زن</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="province">استان</label>
                    <input type="text" id="province" name="province" class="form-control" placeholder="مثال: تهران">
                </div>
            </div>

            <!-- شهر و مدرسه -->
            <div class="grid-2">
                <div class="form-group">
                    <label for="city">شهر</label>
                    <input type="text" id="city" name="city" class="form-control" placeholder="مثال: تهران">
                </div>
                <div class="form-group">
                    <label for="school">مدرسه</label>
                    <select id="school" name="school" class="form-control">
                        <option value="">ابتدا استان و شهر را مشخص کنید (اختیاری)</option>
                    </select>
                </div>
            </div>

            <!-- مسجد -->
            <div class="form-group full-width">
                <label for="mosque">مسجد</label>
                <select id="mosque" name="mosque" class="form-control">
                    <option value="">انتخاب مسجد پایگاه (اختیاری)</option>
                </select>
            </div>

            <!-- رمز عبور -->
            <div class="grid-2">
                <div class="form-group">
                    <label for="password">رمز عبور</label>
                    <input type="password" id="password" name="password" class="form-control" minlength="8" placeholder="حداقل ۸ کاراکتر" dir="ltr" required>
                </div>
                <div class="form-group">
                    <label for="password_confirm">تکرار رمز عبور</label>
                    <input type="password" id="password_confirm" name="password_confirm" class="form-control" minlength="8" placeholder="تکرار دقیق رمز عبور" dir="ltr" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary submit-btn">
                ایجاد حساب کاربری
            </button>
        </form>

        <div class="login-prompt">
            قبلاً ثبت‌نام کرده‌اید؟
            <a href="{% url 'login' %}">وارد شوید</a>
        </div>
    </div>
</div>

<style>
    /* استایل‌های کلی قالب ثبت‌نام */
    .auth-container {
        min-height: calc(100vh - 200px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 5%;
        direction: rtl;
    }

    .glass-card {
        max-width: 700px;
        width: 100%;
        padding: 2.5rem;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .card-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .card-header h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
        font-weight: 700;
    }

    .subtitle {
        color: var(--gray-light, #a0a0a0);
        font-size: 0.95rem;
    }

    /* سیستم گرید برای فرم‌ها */
    .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.25rem;
        margin-bottom: 1.25rem;
    }
    
    .full-width {
        margin-bottom: 1.25rem;
    }

    /* استایل فیلدها */
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--gray-light, #d1d1d1);
        font-size: 0.9rem;
    }

    .form-control {
        width: 100%;
        padding: 0.9rem 1rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: var(--white, #ffffff);
        font-size: 0.95rem;
        transition: all 0.3s ease;
        font-family: inherit;
    }

    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.3);
    }

    .form-control:focus {
        outline: none;
        border-color: var(--primary-gold, #ffd700);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    select.form-control option {
        background: #1a1a1a;
        color: #fff;
    }

    /* استایل دکمه */
    .submit-btn {
        width: 100%;
        padding: 1rem;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 12px;
        margin-top: 1rem;
        cursor: pointer;
        background: var(--primary-gold, #ffd700);
        color: #000;
        border: none;
        transition: all 0.3s ease;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
    }
    
    .submit-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
    }

    /* پیام‌های خطا و موفقیت */
    .error-message, .success-message {
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
        text-align: center;
        font-weight: 500;
    }

    .error-message {
        background: rgba(244, 67, 54, 0.15);
        border: 1px solid rgba(244, 67, 54, 0.5);
        color: #ff8a80;
    }

    .success-message {
        background: rgba(76, 175, 80, 0.15);
        border: 1px solid rgba(76, 175, 80, 0.5);
        color: #b9f6ca;
    }

    /* لینک ورود */
    .login-prompt {
        text-align: center;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--gray-light, #a0a0a0);
        font-size: 0.95rem;
    }

    .login-prompt a {
        color: var(--primary-gold, #ffd700);
        text-decoration: none;
        font-weight: 600;
        margin-right: 0.5rem;
        transition: color 0.3s;
    }

    .login-prompt a:hover {
        text-decoration: underline;
    }

    /* ریسپانسیو برای موبایل */
    @media (max-width: 768px) {
        .grid-2 {
            grid-template-columns: 1fr;
            gap: 0;
        }
        .grid-2 .form-group {
            margin-bottom: 1.25rem;
        }
        .auth-container {
            padding: 1.5rem 1rem;
        }
        .glass-card {
            padding: 1.5rem;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('register-form');
        const messageContainer = document.getElementById('message-container');
        const schoolSelect = document.getElementById('school');
        const mosqueSelect = document.getElementById('mosque');

        // تابع کمکی برای دریافت اطلاعات مساجد و مدارس از API
        async function loadSelect(url, selectEl) {
            try {
                const res = await fetch(url);
                if (!res.ok) return;
                const data = await res.json();
                const results = data.results || data;
                results.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.id;
                    opt.textContent = item.name;
                    selectEl.appendChild(opt);
                });
            } catch (error) {
                console.error('خطا در بارگذاری اطلاعات:', error);
            }
        }

        // بارگذاری داده‌های پایه در صورت نیاز
        loadSelect('/api/geography/schools/', schoolSelect);
        loadSelect('/api/geography/mosques/', mosqueSelect);

        // مدیریت رویداد سابمیت فرم
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            messageContainer.innerHTML = '';

            const phone_number = document.getElementById('phone_number').value.trim();
            const first_name = document.getElementById('first_name').value.trim();
            const last_name = document.getElementById('last_name').value.trim();
            const national_code = document.getElementById('national_code').value.trim();
            const birth_date = document.getElementById('birth_date').value;
            const gender = document.getElementById('gender').value;
            const school = schoolSelect.value || null;
            const mosque = mosqueSelect.value || null;
            const city = document.getElementById('city').value.trim();
            const province = document.getElementById('province').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;

            // اعتبارسنجی سمت کاربر (Client-side Validation)
            if (!/^09\d{9}$/.test(phone_number)) {
                showMessage('شماره تلفن باید ۱۱ رقمی و با ۰۹ شروع شود.', 'error');
                return;
            }

            if (national_code && !/^\d{10}$/.test(national_code)) {
                showMessage('کد ملی باید یک عدد ۱۰ رقمی معتبر باشد.', 'error');
                return;
            }

            if (password.length < 8) {
                showMessage('رمز عبور باید حداقل ۸ کاراکتر باشد.', 'error');
                return;
            }

            if (password !== passwordConfirm) {
                showMessage('رمز عبور و تکرار آن با هم مطابقت ندارند.', 'error');
                return;
            }

            const payload = {
                phone_number,
                first_name,
                last_name,
                password,
                national_code: national_code || null,
                birth_date: birth_date || null,
                gender: gender || null,
                school,
                mosque,
                city: city || null,
                province: province || null
            };

            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'در حال پردازش...';
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/accounts/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    // مدیریت خطاهای دریافتی از سرور
                    const detail = data.detail || (typeof data === 'object' ? Object.values(data).flat().join(' | ') : 'خطا در ثبت‌نام');
                    showMessage(detail, 'error');
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                    return;
                }

                // ذخیره توکن‌ها
                localStorage.setItem('access_token', data.access || data.access_token);
                localStorage.setItem('refresh_token', data.refresh || data.refresh_token);
                localStorage.setItem('user_type', 'user');

                showMessage('ثبت‌نام با موفقیت انجام شد. در حال انتقال به داشبورد...', 'success');
                
                // انتقال پس از موفقیت
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);

            } catch (err) {
                showMessage('خطا در برقراری ارتباط با سرور. لطفاً اتصال اینترنت خود را بررسی کنید.', 'error');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        // تابع نمایش پیام‌ها
        function showMessage(message, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = type === 'error' ? 'error-message' : 'success-message';
            msgDiv.textContent = message;
            messageContainer.appendChild(msgDiv);
            
            // اسکرول به پیام
            msgDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    });
</script>
{% endblock %}
